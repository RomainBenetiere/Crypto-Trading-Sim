[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcs"
version = "0.1.0"
description = "Simulateur Monte-Carlo de trading crypto (Bitvavo, paper trading)"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "websockets>=13",
    "pandas>=2.2",
    "numpy>=1.26",
    "python-dotenv>=1.0",
    "scipy>=1.15",
    "streamlit>=1.40",
    "plotly>=5.24",
    "tzdata>=2024.1",  # fuseau Europe/Paris dans les images Docker minimales
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.11",
    "ta-lib>=0.6",  # référence pour les tests des indicateurs uniquement
]

[tool.setuptools.packages.find]
include = ["mcs*"]

[tool.setuptools.package-data]
"mcs.storage" = ["schema.sql"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# Typographie française dans les docstrings et commentaires.
allowed-confusables = ["−", "×"]

[tool.ruff.lint.per-file-ignores]
# Textes d'interface en français : longues chaînes acceptées.
"dashboard/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "live: appelle la vraie API publique Bitvavo (activer avec MCS_LIVE_TESTS=1)",
]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
