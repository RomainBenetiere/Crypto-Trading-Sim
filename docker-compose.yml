# Production (conteneur Docker sur le serveur Proxmox). Le dashboard viendra à l'étape 9.
services:
  engine:
    build: .
    command: ["python", "-m", "mcs.engine"]
    env_file: .env
    environment:
      DB_PATH: /data/mcs.sqlite
      SQLITE_JOURNAL_MODE: WAL
      LOG_DIR: /app/logs
    volumes:
      - mcs-data:/data
      - mcs-logs:/app/logs
    restart: unless-stopped
    stop_grace_period: 30s

volumes:
  mcs-data:
  mcs-logs:
