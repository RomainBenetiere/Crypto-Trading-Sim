# Production : conteneurs Docker sur le serveur Proxmox (voir docs/DEPLOIEMENT.md).
# Base et journaux sur le disque local du serveur (./data, ./logs), jamais sur un partage
# réseau : SQLite y tourne en WAL, partagé par le moteur et le dashboard.
x-common: &common
  build: .
  env_file: .env
  environment:
    DB_PATH: /data/mcs.sqlite
    SQLITE_JOURNAL_MODE: WAL
    LOG_DIR: /app/logs
    TZ: Europe/Paris
  volumes:
    - ./data:/data
    - ./logs:/app/logs
  restart: unless-stopped

services:
  engine:
    <<: *common
    command: ["python", "-m", "mcs.engine"]
    stop_grace_period: 30s

  dashboard:
    <<: *common
    command: ["streamlit", "run", "dashboard/app.py", "--server.address=0.0.0.0",
              "--server.port=8501", "--server.headless=true",
              "--browser.gatherUsageStats=false"]
    # La clé Bitvavo ne sert qu'au moteur : le dashboard lit le solde en base.
    environment:
      DB_PATH: /data/mcs.sqlite
      SQLITE_JOURNAL_MODE: WAL
      LOG_DIR: /app/logs
      TZ: Europe/Paris
      BITVAVO_API_KEY: ""
      BITVAVO_API_SECRET: ""
    # Réseau local uniquement (décision 35) : ne pas exposer ce port à Internet.
    ports:
      - "8501:8501"
    depends_on:
      - engine
